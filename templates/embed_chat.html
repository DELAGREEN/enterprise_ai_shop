<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ agent_name }}</title>
    <script src="/static/vendor/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff; color: #1f2937; font-size: 14px; }
        .wrap { display: flex; flex-direction: column; height: 100vh; }
        header {
            padding: 10px 14px; border-bottom: 1px solid #e5e7eb;
            display: flex; justify-content: space-between; align-items: center;
            background: #f9fafb;
        }
        header .title { font-weight: 600; font-size: .95rem; }
        header .user { font-size: .75rem; color: #6b7280; }
        header a.open-full {
            font-size: .8rem; color: #2563eb; text-decoration: none;
            padding: 4px 10px; border: 1px solid #2563eb; border-radius: 6px;
        }
        header a.open-full:hover { background: #2563eb; color: #fff; }
        .messages { flex: 1; overflow-y: auto; padding: 12px; }
        .msg {
            margin-bottom: 10px; padding: 8px 12px; border-radius: 10px;
            max-width: 85%; word-wrap: break-word; line-height: 1.45;
            white-space: normal;
        }
        .msg.user { background: #dbeafe; margin-left: auto; }
        .msg.bot { background: #f3f4f6; }
        .msg pre { background: #111827; color: #f9fafb; padding: 8px; border-radius: 6px; overflow-x: auto; font-size: .85em; }
        .msg code { background: #e5e7eb; padding: 1px 4px; border-radius: 4px; font-size: .9em; }
        .msg pre code { background: transparent; padding: 0; }
        .thinking {
            background: #fff7ed; border-left: 3px solid #f59e0b;
            padding: 8px 12px; margin-bottom: 8px; font-size: .85rem;
            color: #78350f; border-radius: 6px; display: none;
        }
        .thinking.visible { display: block; }
        .input-row {
            display: flex; gap: 6px; padding: 10px;
            border-top: 1px solid #e5e7eb; align-items: flex-end;
        }
        .input-row textarea {
            flex: 1; resize: none; border: 1px solid #d1d5db;
            border-radius: 8px; padding: 8px 10px; font-family: inherit;
            font-size: .9rem; min-height: 36px; max-height: 120px;
            overflow-y: hidden; outline: none;
        }
        .input-row textarea:focus { border-color: #2563eb; }
        .input-row button {
            padding: 8px 14px; background: #2563eb; color: #fff;
            border: none; border-radius: 8px; cursor: pointer; height: 36px;
        }
        .input-row button:disabled { opacity: .5; cursor: not-allowed; }
        .toolbar {
            padding: 6px 10px; border-top: 1px solid #f3f4f6;
            background: #fafafa; font-size: .75rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .toolbar button {
            background: transparent; border: none; color: #6b7280;
            cursor: pointer; font-size: .8rem;
        }
        .toolbar button:hover { color: #111827; }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <div>
            <div class="title">{{ agent_name }}</div>
            <div class="user">вы вошли как <b>{{ embed_user }}</b></div>
        </div>
        <a class="open-full" href="{{ full_url }}" target="_blank" rel="noopener">Открыть полностью ↗</a>
    </header>

    <div class="messages" id="messages">
        {% for m in messages %}
            <div class="msg {{ 'user' if m.role == 'user' else 'bot' }}">
                {% if m.thinking %}
                    <div class="thinking"><b>Мышление:</b><br><span class="tb" data-raw="{{ m.thinking }}"></span></div>
                {% endif %}
                <div class="content" data-raw="{{ m.content }}"></div>
            </div>
        {% endfor %}
    </div>

    <div class="toolbar">
        <button id="thinkToggle">Скрыть мышление</button>

        {% if APP_NAME %}
        <span class="muted" style="color:#9ca3af;">powered by {{ APP_NAME }}</span>
        {% endif %}
    </div>

    <form class="input-row" id="chatForm" autocomplete="off">
        <textarea id="msgInput" rows="1" placeholder="Напишите сообщение... (Enter — отправить, Shift+Enter — новая строка)" required></textarea>
        <button type="submit" id="sendBtn">→</button>
    </form>
</div>

<script>
const FLOW_ID = {{ flow_id|tojson }};
const CHAT_ID = {{ chat_id|tojson }};

// Токен всегда берём из URL iframe
const _q = new URLSearchParams(window.location.search);
const TOKEN = {
    i: _q.get('i'),
    u: _q.get('u'),
    e: parseInt(_q.get('e')),
    n: _q.get('n'),
    s: _q.get('s'),
};

const messagesEl = document.getElementById('messages');
const form = document.getElementById('chatForm');
const input = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const thinkToggle = document.getElementById('thinkToggle');

let showThinking = true;

function autosize() {
    input.style.height = 'auto';
    const h = Math.min(input.scrollHeight, 120);
    input.style.height = h + 'px';
    input.style.overflowY = input.scrollHeight > 120 ? 'auto' : 'hidden';
}
input.addEventListener('input', autosize);
autosize();

input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
    }
});

function renderMd(el, raw) { el.innerHTML = raw ? marked.parse(raw) : ''; }
document.querySelectorAll('.msg .content').forEach(el => renderMd(el, el.dataset.raw || ''));
document.querySelectorAll('.msg .tb').forEach(el => renderMd(el, el.dataset.raw || ''));

thinkToggle.addEventListener('click', () => {
    showThinking = !showThinking;
    document.querySelectorAll('.thinking').forEach(el => el.classList.toggle('visible', showThinking));
    thinkToggle.textContent = showThinking ? 'Скрыть мышление' : 'Показать мышление';
});

function appendUser(text) {
    const d = document.createElement('div');
    d.className = 'msg user';
    const c = document.createElement('div');
    c.className = 'content';
    c.textContent = text;
    d.appendChild(c);
    messagesEl.appendChild(d);
    messagesEl.scrollTop = messagesEl.scrollHeight;
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    appendUser(text);
    input.value = '';
    autosize();
    sendBtn.disabled = true;

    const botDiv = document.createElement('div');
    botDiv.className = 'msg bot';
    botDiv.innerHTML = '<em>…</em>';
    messagesEl.appendChild(botDiv);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
        const res = await fetch(`/embed/chat/${FLOW_ID}/${CHAT_ID}/send`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                message: text,
                i: TOKEN.i, u: TOKEN.u, e: TOKEN.e, n: TOKEN.n, s: TOKEN.s,
            })
        });
        if (!res.ok) {
            throw new Error('HTTP ' + res.status + ': ' + (await res.text()));
        }
        const data = await res.json();
        botDiv.innerHTML = '';
        if (data.thinking) {
            const t = document.createElement('div');
            t.className = 'thinking' + (showThinking ? ' visible' : '');
            t.innerHTML = '<b>Мышление:</b><br>' + marked.parse(data.thinking);
            botDiv.appendChild(t);
        }
        const c = document.createElement('div');
        c.className = 'content';
        c.innerHTML = marked.parse(data.text || '');
        botDiv.appendChild(c);
    } catch (err) {
        botDiv.innerHTML = '<span style="color:#dc2626;">Ошибка: ' + err.message + '</span>';
    } finally {
        sendBtn.disabled = false;
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
});

input.focus();
messagesEl.scrollTop = messagesEl.scrollHeight;
</script>
</body>
</html>
