<!DOCTYPE html>
<html lang="ru" data-theme="{{ theme|default('light') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ agent_name }}</title>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('ui-theme');
                if (saved === 'light' || saved === 'dark') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
            } catch (e) {}
        })();
    </script>
    <script src="/static/vendor/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --surface-2: #f9fafb;
            --surface-3: #f3f4f6;
            --border: #e5e7eb;
            --border-strong: #d1d5db;
            --text: #1f2937;
            --text-strong: #111827;
            --text-muted: #6b7280;
            --primary: #2563eb;
            --primary-soft: #dbeafe;
            --primary-text: #3730a3;
            --code-bg: #111827;
            --code-text: #f9fafb;
            --inline-code-bg: #e5e7eb;
            --warning-soft: #fff7ed;
            --warning-border: #f59e0b;
            --warning-text: #78350f;
            --danger-text: #dc2626;
        }
        [data-theme="dark"] {
            --bg: #0f172a;
            --surface-2: #16203a;
            --surface-3: #223050;
            --border: #2a3a5c;
            --border-strong: #3a4d73;
            --text: #e2e8f0;
            --text-strong: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-soft: #1e3a8a;
            --primary-text: #bfdbfe;
            --code-bg: #0b1220;
            --code-text: #e2e8f0;
            --inline-code-bg: #223050;
            --warning-soft: #3a2a12;
            --warning-border: #b45309;
            --warning-text: #fcd34d;
            --danger-text: #fca5a5;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
        .wrap { display: flex; flex-direction: column; height: 100vh; }
        header {
            padding: 10px 14px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            background: var(--surface-2);
        }
        header .title { font-weight: 600; font-size: .95rem; }
        header .user { font-size: .75rem; color: var(--text-muted); }
        header a.open-full {
            font-size: .8rem; color: var(--primary); text-decoration: none;
            padding: 4px 10px; border: 1px solid var(--primary); border-radius: 6px;
        }
        header a.open-full:hover { background: var(--primary); color: #fff; }
        .messages { flex: 1; overflow-y: auto; padding: 12px; }
        .msg {
            margin-bottom: 10px; padding: 8px 12px; border-radius: 10px;
            max-width: 85%; word-wrap: break-word; line-height: 1.45;
            white-space: normal;
        }
        .msg.user { background: var(--primary-soft); margin-left: auto; }
        .msg.bot { background: var(--surface-3); }
        .msg pre { background: var(--code-bg); color: var(--code-text); padding: 8px; border-radius: 6px; overflow-x: auto; font-size: .85em; }
        .msg code { background: var(--inline-code-bg); padding: 1px 4px; border-radius: 4px; font-size: .9em; }
        .msg pre code { background: transparent; padding: 0; }
        .thinking {
            background: var(--warning-soft); border-left: 3px solid var(--warning-border);
            padding: 8px 12px; margin-bottom: 8px; font-size: .85rem;
            color: var(--warning-text); border-radius: 6px; display: none;
        }
        .thinking.visible { display: block; }
        .loading { color: var(--text-muted); font-style: italic; font-size: .85rem; }
        .input-row {
            display: flex; gap: 6px; padding: 10px;
            border-top: 1px solid var(--border); align-items: flex-end;
        }
        .input-row textarea {
            flex: 1; resize: none; border: 1px solid var(--border-strong);
            border-radius: 8px; padding: 8px 10px; font-family: inherit;
            font-size: .9rem; min-height: 36px; max-height: 120px;
            overflow-y: hidden; outline: none;
        }
        .input-row textarea:focus { border-color: var(--primary); }
        .input-row button {
            padding: 8px 14px; background: var(--primary); color: #fff;
            border: none; border-radius: 8px; cursor: pointer; height: 36px;
        }
        .input-row button:disabled { opacity: .5; cursor: not-allowed; }
        .toolbar {
            padding: 6px 10px; border-top: 1px solid var(--border);
            background: var(--surface-2); font-size: .75rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .toolbar button {
            background: transparent; border: none; color: var(--text-muted);
            cursor: pointer; font-size: .8rem;
        }
        .toolbar button:hover { color: var(--text-strong); }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <div>
            <div class="title">{{ agent_name }}</div>
            <div class="user">вы вошли как <b>{{ embed_user }}</b></div>
        </div>
        <a class="open-full" href="{{ full_url }}" target="_blank" rel="noopener">Открыть полностью ↗</a>
    </header>

    <div class="messages" id="messages">
        {% for m in messages %}
            <div class="msg {{ 'user' if m.role == 'user' else 'bot' }}">
                {% if m.thinking %}
                    <div class="thinking{% if show_thinking %} visible{% endif %}"><b>Мышление:</b><br><span class="tb" data-raw="{{ m.thinking }}"></span></div>
                {% endif %}
                <div class="content" data-raw="{{ m.content }}"></div>
            </div>
        {% endfor %}
    </div>

    <div class="toolbar">
        <button id="thinkToggle">{{ 'Скрыть мышление' if show_thinking else 'Показать мышление' }}</button>

        {% if APP_NAME %}
        <span class="muted" style="color:#9ca3af;">powered by {{ APP_NAME }}</span>
        {% endif %}
    </div>

    <form class="input-row" id="chatForm" autocomplete="off">
        <textarea id="msgInput" rows="1" placeholder="Напишите сообщение... (Enter — отправить, Shift+Enter — новая строка)" required></textarea>
        <button type="submit" id="sendBtn">→</button>
    </form>
</div>

<script>
const FLOW_ID = {{ flow_id|tojson }};
const CHAT_ID = {{ chat_id|tojson }};

// Токен всегда берём из URL iframe
const _q = new URLSearchParams(window.location.search);
const TOKEN = {
    i: _q.get('i'),
    u: _q.get('u'),
    e: parseInt(_q.get('e')),
    n: _q.get('n'),
    s: _q.get('s'),
};

const messagesEl = document.getElementById('messages');
const form = document.getElementById('chatForm');
const input = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const thinkToggle = document.getElementById('thinkToggle');

let showThinking = {{ 'true' if show_thinking else 'false' }};

function autosize() {
    input.style.height = 'auto';
    const h = Math.min(input.scrollHeight, 120);
    input.style.height = h + 'px';
    input.style.overflowY = input.scrollHeight > 120 ? 'auto' : 'hidden';
}
input.addEventListener('input', autosize);
autosize();

input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
    }
});

function renderMd(el, raw) { el.innerHTML = raw ? marked.parse(raw) : ''; }
document.querySelectorAll('.msg .content').forEach(el => renderMd(el, el.dataset.raw || ''));
document.querySelectorAll('.msg .tb').forEach(el => renderMd(el, el.dataset.raw || ''));

function applyThinkingVisibility() {
    document.querySelectorAll('.thinking').forEach(el => el.classList.toggle('visible', showThinking));
    thinkToggle.textContent = showThinking ? 'Скрыть мышление' : 'Показать мышление';
}

function saveThinkingPref(enabled) {
    // fire-and-forget: состояние живёт на сервере, в рамках чата
    fetch(`/embed/chat/${FLOW_ID}/${CHAT_ID}/thinking`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            enabled,
            i: TOKEN.i, u: TOKEN.u, e: TOKEN.e, n: TOKEN.n, s: TOKEN.s,
        }),
    }).catch(() => {});
}

thinkToggle.addEventListener('click', () => {
    showThinking = !showThinking;
    applyThinkingVisibility();
    saveThinkingPref(showThinking);
});
applyThinkingVisibility();

function appendUser(text) {
    const d = document.createElement('div');
    d.className = 'msg user';
    const c = document.createElement('div');
    c.className = 'content';
    c.textContent = text;
    d.appendChild(c);
    messagesEl.appendChild(d);
    messagesEl.scrollTop = messagesEl.scrollHeight;
}

/* ---------- Потоковый ответ (SSE) ---------- */
async function readSSE(res, onEvent) {
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    for (;;) {
        const {done, value} = await reader.read();
        if (done) break;
        buf += decoder.decode(value, {stream: true});
        let idx;
        while ((idx = buf.indexOf('\n\n')) !== -1) {
            const raw = buf.slice(0, idx);
            buf = buf.slice(idx + 2);
            let event = 'message';
            let data = '';
            for (const line of raw.split('\n')) {
                if (line.startsWith('event:')) event = line.slice(6).trim();
                else if (line.startsWith('data:')) data += line.slice(5).trim();
            }
            if (!data) continue;
            try { onEvent(event, JSON.parse(data)); } catch (e) {}
        }
    }
}

function makeBotBubble() {
    const botDiv = document.createElement('div');
    botDiv.className = 'msg bot';
    const loading = document.createElement('div');
    loading.className = 'loading';
    loading.textContent = 'Генерация ответа…';
    botDiv.appendChild(loading);
    messagesEl.appendChild(botDiv);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return botDiv;
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    appendUser(text);
    input.value = '';
    autosize();
    sendBtn.disabled = true;

    const botDiv = makeBotBubble();

    // Блок мышления готовим сразу, показываем с первыми токенами
    const thinkingEl = document.createElement('div');
    thinkingEl.className = 'thinking' + (showThinking ? ' visible' : '');
    thinkingEl.style.display = 'none';
    const thinkingBody = document.createElement('div');
    thinkingEl.appendChild(thinkingBody);

    let contentEl = null;
    let gotAnswer = false;

    const dropLoading = () => {
        const el = botDiv.querySelector('.loading');
        if (el) el.remove();
    };
    const ensureContent = () => {
        if (!contentEl) {
            contentEl = document.createElement('div');
            contentEl.className = 'content';
            botDiv.appendChild(contentEl);
        }
        return contentEl;
    };
    const appendTo = (el, chunk) => {
        el.dataset.raw = (el.dataset.raw || '') + chunk;
        el.innerHTML = marked.parse(el.dataset.raw);
    };
    const showThinkingBlock = () => {
        if (!thinkingEl.parentNode) botDiv.insertBefore(thinkingEl, botDiv.firstChild);
        thinkingEl.style.display = '';
    };

    let started = false;
    try {
        const res = await fetch(`/embed/chat/${FLOW_ID}/${CHAT_ID}/send-stream`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                message: text,
                i: TOKEN.i, u: TOKEN.u, e: TOKEN.e, n: TOKEN.n, s: TOKEN.s,
            })
        });
        if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
        started = true;

        await readSSE(res, (ev, d) => {
            if (ev === 'thinking') {
                showThinkingBlock();
                appendTo(thinkingBody, d.text);
            } else if (ev === 'answer') {
                // Плашку «Генерация ответа…» убираем только с началом ответа
                if (!gotAnswer) { gotAnswer = true; dropLoading(); }
                appendTo(ensureContent(), d.text);
            } else if (ev === 'reset') {
                gotAnswer = true;
                thinkingEl.remove();
                dropLoading();
                const el = ensureContent();
                el.dataset.raw = d.text;
                el.innerHTML = marked.parse(d.text);
            } else if (ev === 'done') {
                const th = (d.thinking || '').trim();
                if (th) {
                    thinkingBody.dataset.raw = th;
                    thinkingBody.innerHTML = marked.parse(th);
                    showThinkingBlock();
                } else {
                    thinkingEl.remove();
                }
                dropLoading();
                const el = ensureContent();
                el.dataset.raw = d.text || '';
                el.innerHTML = marked.parse(d.text || '');
            } else if (ev === 'error') {
                botDiv.innerHTML = '<span style="color:var(--danger-text);">Ошибка: ' + (d.error || 'flow') + '</span>';
            }
            messagesEl.scrollTop = messagesEl.scrollHeight;
        });
    } catch (err) {
        // Поток не поднялся — откатываемся на обычный запрос
        if (!started) {
            botDiv.remove();
            await sendFallback(text);
            return;
        }
        botDiv.innerHTML = '<span style="color:var(--danger-text);">Ошибка: ' + err.message + '</span>';
    } finally {
        sendBtn.disabled = false;
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
});

/* Резервный путь: обычный запрос без стриминга */
async function sendFallback(text) {
    const botDiv = makeBotBubble();
    try {
        const res = await fetch(`/embed/chat/${FLOW_ID}/${CHAT_ID}/send`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                message: text,
                i: TOKEN.i, u: TOKEN.u, e: TOKEN.e, n: TOKEN.n, s: TOKEN.s,
            })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        botDiv.innerHTML = '';
        if (data.thinking) {
            const t = document.createElement('div');
            t.className = 'thinking' + (showThinking ? ' visible' : '');
            t.innerHTML = '<b>Мышление:</b><br>' + marked.parse(data.thinking);
            botDiv.appendChild(t);
        }
        const c = document.createElement('div');
        c.className = 'content';
        c.innerHTML = marked.parse(data.text || '');
        botDiv.appendChild(c);
    } catch (err) {
        botDiv.innerHTML = '<span style="color:var(--danger-text);">Ошибка: ' + err.message + '</span>';
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
}

input.focus();
messagesEl.scrollTop = messagesEl.scrollHeight;
</script>
</body>
</html>
