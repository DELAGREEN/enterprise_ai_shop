version: '3.8'

services:
  ia_shop_db:
    image: postgres:16
    container_name: ai_shop_db
    #network_mode: bridge
    restart: unless-stopped
    #ports:
    #  - "5432:5432"
    environment:
      POSTGRES_USER: ai_shop
      POSTGRES_PASSWORD: ai_shop_password
      POSTGRES_DB: ai_shop
      TZ: Europe/Moscow
    volumes:
      - ./ai_shop_db:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_shop"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai_shop
  
  ldap:
    image: osixia/openldap:1.5.0
    container_name: ldap
    #network_mode: bridge
    restart: unless-stopped
    #ports:
    #  - "389:389"
    #  - "636:636"
    environment:
      - TZ=Europe/Moscow 
      - LDAP_ORGANISATION=MyOrg
      - LDAP_DOMAIN=example.com
      - LDAP_ADMIN_PASSWORD=adminpass
      - LDAP_CONFIG_PASSWORD=adminpass
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      #- ./ldap_db/init.ldif:/container/service/slapd/assets/config/bootstrap/ldif/init.ldif
    command: --loglevel debug
    networks:
      - ai_shop

  enterprise-ai-shop:
    image: docker-enterprise-ai-shop
    container_name: enterprise-ai-shop
    #network_mode: bridge
    restart: unless-stopped
    #ports:
    #  - "5001:5001"
    mem_limit: 2g
    env_file:
      - ../.env 
    environment:
      - DATABASE_URL=postgresql+asyncpg://ai_shop:ai_shop_password@ia_shop_db/ai_shop
      - LDAP_SERVER=ldap:389
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - ai_shop

  nginx:
    image: registry.astralinux.ru/library/astra/ubi17-nginx1283:latest
    container_name: nginx-proxy
    #network_mode: bridge
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # Монтируем ваш конфиг внутрь контейнера
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # Если ваше приложение в другой сети, укажите её
    networks:
      - ai_shop

# Если нужно объединить с приложением, раскомментируйте и настройте сеть
    
volumes:
  ai_shop_db:
  ldap_db:

networks:
  ai_shop:
    #external: true