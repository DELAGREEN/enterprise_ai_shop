version: "3.8"

services:
  enterprise-ai-shop:
    build:
    # Контекст сборки – корень проекта (root)
      context: ..
      dockerfile: docker/Dockerfile
      #image: 
    container_name: enterprise-ai-shop
    mem_limit: 2g
    #user: "${UID}:${GID}"
    # (опционально) устанавливаем рабочую директорию внутри контейнера
    working_dir: /app
    env_file:
      - ../.env 
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'python3 -c "import urllib.request, sys; r = urllib.request.urlopen(\"http://127.0.0.1:8000/health\", timeout=5); sys.exit(0 if r.status == 200 else 1)"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
