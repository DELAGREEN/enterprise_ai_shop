# ─── Обязательный map для WebSocket ─────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ai_shop {
    server enterprise-ai-shop:5001;
    keepalive 32;
}

upstream langflow {
    server langflow:7860;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 100M;

    # ─── Статика нашего приложения ─────────────────────
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    # ─── Langflow UI ──────────────────────────────────
    # Внимание: Langflow не поддерживает работу по подпути!
    # Скорее всего, UI не заработает. См. примечание ниже.
    location /langflow/ {
        proxy_pass http://langflow/;    # ← слеш в конце ОБЯЗАТЕЛЕН
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Remote-User     $remote_user;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering    off;
    }

    # ─── Наше приложение ───────────────────────────────
    location / {
        proxy_pass http://ai_shop;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}