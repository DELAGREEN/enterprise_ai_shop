server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://enterprise-ai-shop:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    #location /static/ {
    #    alias /app/static/; # Укажите путь к статике внутри вашего приложения, если нужно
    #}

    #location /templates/ {
    #    alias /app/templates/;
    #}
}