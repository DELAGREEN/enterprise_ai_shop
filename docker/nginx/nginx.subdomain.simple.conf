# ─── Обязательный map для WebSocket ───────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ai_shop {
    server enterprise-ai-shop:5001;
    keepalive 32;
}

upstream langflow {
    server langflow:7860;
    keepalive 32;
}

# ─── Наше приложение ──────────────────────────────
server {
    listen 80;
    server_name agents.localhost;

    client_max_body_size 10M;

    #location /static/ {
    #    alias /var/www/static/;
    #    expires 30d;
    #    access_log off;
    #}

    location / {
        proxy_pass http://ai_shop;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# ─── Langflow UI ──────────────────────────────────
server {
    listen 80;
    server_name langflow.localhost;

    client_max_body_size 100M;

    location / {
        proxy_pass http://langflow;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;   # ← map
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering    off;
    }
}