# ─── Обязательный map для WebSocket ───────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ai_shop {
    server enterprise-ai-shop:5001;
    keepalive 32;
}

upstream langflow {
    server langflow:7860;
    keepalive 32;
}

upstream qdrant {
    server qdrant:6333;
    keepalive 32;
}

# ─── Наше приложение ──────────────────────────────
server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    #location /static/ {
    #    alias /var/www/static/;
    #    expires 30d;
    #    access_log off;
    #}

    location / {
        proxy_pass http://ai_shop;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# ─── Langflow UI ──────────────────────────────────
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://langflow;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering    off;

        # ─── Отключаем сжатие от upstream, чтобы subs_filter сработал ─
        proxy_set_header Accept-Encoding "";

        # ─── Заменяем внешние URL на локальные заглушки ─
        subs_filter_types text/html text/css application/javascript;
        subs_filter 'https://fonts.googleapis.com' 'http://localhost/__fake/fonts';
        subs_filter 'https://fonts.gstatic.com'    'http://localhost/__fake/fonts';
        subs_filter 'https://discord.com'          'http://localhost/__fake/discord';
        subs_filter 'https://discordapp.com'       'http://localhost/__fake/discord';
    }

    # ─── Заглушки, отдаются мгновенно ──────────────
    location /__fake/fonts {
        add_header Content-Type "text/css";
        return 200 "";
    }

    location /__fake/discord {
        add_header Content-Type "text/plain";
        return 200 "";
    }
}

# ─── Qdrant Dashboard ────────────────────────
server {
    listen 80;
    server_name qdrant.localhost;

    client_max_body_size 100M;

    # Базовая авторизация
    #auth_basic           "Qdrant Dashboard";
    #auth_basic_user_file /etc/nginx/htpasswd;

    # Healthcheck без auth — чтобы мониторинг работал
    location = /healthz {
        auth_basic off;
        proxy_pass http://qdrant/healthz;
        access_log off;
    }

    location = /readyz {
        auth_basic off;
        proxy_pass http://qdrant/readyz;
        access_log off;
    }

    # Основной проксинг
    location / {
        proxy_pass http://qdrant;
        proxy_http_version 1.1;

        # WebSocket (нужен dashboard'у)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты — Qdrant-запросы бывают тяжёлыми
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 30s;

        # Не буферизуем — dashboard отдаёт динамику
        proxy_buffering off;
    }
}