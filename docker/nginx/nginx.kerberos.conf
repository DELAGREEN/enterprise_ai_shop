upstream ai_shop {
    server enterprise-ai-shop:5001;
    keepalive 32;
}

# ─── Сервер для HTTP → редирект на HTTPS ─────────────────────
server {
    listen 80;
    server_name agents.example.com;

    # ACME для Let's Encrypt (опционально)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Основной HTTPS-сервер с Kerberos ────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name agents.example.com;

    ssl_certificate     /etc/nginx/certs/agents.crt;
    ssl_certificate_key /etc/nginx/certs/agents.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Langflow может думать долго
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;
    proxy_connect_timeout 15s;

    # ═══════════════════════════════════════════════════════
    #  1. СТАТИКА — без Kerberos, чтобы отдавалась мгновенно
    # ═══════════════════════════════════════════════════════
    location /static/ {
        auth_gss off;
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico {
        auth_gss off;
        alias /var/www/static/favicon.ico;
        access_log off;
    }

    location = /healthz {
        auth_gss off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ═══════════════════════════════════════════════════════
    #  2. ОСНОВНОЙ ЛОКАШЕН — с Kerberos
    # ═══════════════════════════════════════════════════════
    location / {
        auth_gss                on;
        auth_gss_keytab         /etc/krb5.keytab;
        auth_gss_realm          EXAMPLE.COM;
        auth_gss_service_name   HTTP/agents.example.com;
        # Не показываем Basic-диалог браузеру, если Kerberos не сработал
        auth_gss_allow_basic_fallback off;

        # Если Kerberos не получилось — уходим в @fallback
        # (приложение само решит: LDAP-форма или заглушка для iframe)
        error_page 401 = @fallback;

        proxy_pass http://ai_shop;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 👇 ключевой заголовок — имя пользователя из Kerberos
        proxy_set_header X-Remote-User     $remote_user;
    }

    # ═══════════════════════════════════════════════════════
    #  3. FALLBACK — Kerberos не сработал
    #     Проксируем БЕЗ X-Remote-User, чтобы приложение
    #     показало LDAP-форму или заглушку для iframe
    # ═══════════════════════════════════════════════════════
    location @fallback {
        proxy_pass http://ai_shop;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Remote-User     "";
    }
}