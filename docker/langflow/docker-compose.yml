version: '3.8'

services:
  langflow-db:
    image: postgres:16
    container_name: langflow-db
    restart: always
    #ports:
    #  - "5432:5432"
    environment:
      - POSTGRES_USER=langflow
      - POSTGRES_PASSWORD=langflow_password
      - POSTGRES_DB=langflow
      - TZ=Europe/Moscow 
    volumes:
      - langflow_db:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - langflow-network
  
  langflow-redis:
    image: redis:7-alpine
    container_name: langflow-redis
    restart: always
    #ports:
    #  - "6379:6379"
    volumes:
      - langflow_redis_data:/data
    healthcheck:                              
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - langflow-network

  langflow:
    image: langflowai/langflow:latest
    container_name: langflow
    restart: always
    ports:
      - "7860:7860"            
    environment:
      - DO_NOT_TRACK=true
      - LANGFLOW_AUTHZ_AUDIT_ENABLED=true
      # Таймзона
      - TZ=Europe/Moscow
      # Подключение к PostgreSQL
      - LANGFLOW_DATABASE_URL=postgresql://langflow:langflow_password@langflow-db:5432/langflow
      # Настройки суперпользователя (логин по умолчанию: langflow)
      # - LANGFLOW_SUPERUSER
      - LANGFLOW_SUPERUSER_PASSWORD=admin_password   # смени на свой
      #Белый список защиты от SSR атак
      - LANGFLOW_SSRF_ALLOWED_HOSTS=host.docker.internal,0.0.0.0/0
      #A2A
      - LANGFLOW_A2A_ENABLED=true
      - LANGFLOW_CORS_ALLOW_ORIGINS=*   # разрешить все источники (небезопасно для продакшена)
      # 👇 ЭТИ ДВЕ СТРОКИ СНИМАЮТ БЛОКИРОВКУ БЕЗОПАСНОСТИ ДЛЯ ТЕСТА
      #- LANGFLOW_COMPONENTS_ALLOW_CUSTOM=true
      #- LANGFLOW_COMPONENTS_VALIDATE_CUSTOM=false

      #- LANGFLOW_SECRET_KEY=0d3a7fae637d1b852f91dfba363fa394b1bdb08910c1f22a6ff129a9e3010ea9
      #- LANGFLOW_NEW_USER_IS_ACTIVE=False
      #- LANGFLOW_ENABLE_SIGNUP=False
      #- LANGFLOW_ENABLE_SUPERUSER_CLI=False
      - LANGFLOW_ALLOW_CUSTOM_COMPONENTS=true
      - LANGFLOW_​AUTHZ_​ENABLED=true


      # При значении true пользователи, не являющиеся суперпользователями, по-прежнему могут просматривать 
      # и использовать пользовательские компоненты в потоках, но они не могут создавать новые пользовательские 
      # компоненты или редактировать код пользовательского компонента.При значении true пользователи, не являющиеся 
      # суперпользователями, по-прежнему могут просматривать и использовать пользовательские компоненты в потоках, 
      # но они не могут создавать новые пользовательские компоненты или редактировать код пользовательского компонента:
      - LANGFLOW_CUSTOM_COMPONENT_ADMIN_ONLY=true # Не удалять
      # Позволяет запускать кастомные компаненты 
      - LANGFLOW_ALLOW_PUBLIC_CUSTOM_COMPONENTS=true
      # Несколько воркеров работает на redis использует 0 и 1 очередь
      #- LANGFLOW_WORKERS=3  # any value > 1
      #- LANGFLOW_JOB_QUEUE_TYPE=redis
      #- LANGFLOW_REDIS_QUEUE_URL=redis://your-redis-host:6379/1
      
      # или конкретно ваш домен:
      # - LANGFLOW_CORS_ALLOW_ORIGINS=http://192.168.0.169:7860,https://ваш-домен.ru
      # Настройки, которые заставят внутреннего агента видеть твой vLLM по умолчанию:
      #- OPENAI_API_KEY=           # Прописываем любой ключ-заглушку глобально
      #- OPENAI_API_BASE=http://host.docker.internal:8081/v1 # Ссылка на контейнер vLLM
      # Если встроенный агент по умолчанию ищет конкретное имя модели, можно жестко задать его:
      #- OPENAI_MODEL_NAME=Qwen/Qwen3.5-9B
      - LANGFLOW_UPLOAD_FOLDER=/app/uploads
      - VLLM_API_KEY=dummy
      #DOMAIN AUTHENTICATE
      - LANGFLOW_AUTO_LOGIN=true
      #- LANGFLOW_EXTERNAL_AUTH_ENABLED=true
      #- LANGFLOW_EXTERNAL_AUTH_PROVIDER=keycloak
      #- LANGFLOW_EXTERNAL_AUTH_PROVIDER_NAME=Keycloak
      #- LANGFLOW_EXTERNAL_AUTH_TOKEN_HEADER=Authorization

      # Keycloak realm endpoints (http is allowed for localhost in development)
      #- LANGFLOW_EXTERNAL_AUTH_TRUSTED_JWT_DECODE=true
      #- LANGFLOW_EXTERNAL_AUTH_JWKS_URL=http://127.0.0.1:8080/realms/langflow/protocol/openid-connect/certs
      #- LANGFLOW_EXTERNAL_AUTH_ISSUER=http://localhost:8080/realms/langflow
      #- LANGFLOW_EXTERNAL_AUTH_AUDIENCE=langflow-app
      #XmDAsoUB8XX6ymOScb444WM1ev3yU37X
      #http://localhost:8080/realms/langflow/protocol/openid-connect/auth?client_id=langflow-app&redirect_uri=http://localhost:7860&response_type=code&scope=openid
      
      #-----Enable the Redis job queue-----
      - LANGFLOW_WORKERS=3  # any value > 1
      - LANGFLOW_JOB_QUEUE_TYPE=redis
      - LANGFLOW_REDIS_QUEUE_URL=redis://langflow-redis:6379/1
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./langflow_data:/app/.langflow   # для хранения файлов flows (если нужны)
      - ./langflow_uploads:/app/uploads
      - ./chroma_db:/app/chroma_db 
      - ./faiss_db:/app/faiss_db
    depends_on:
      langflow-db:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
      langflow-redis:
        condition: service_healthy
      #qdrant:
      #  condition: service_healthy
      #chroma:
      #  condition: service_healthy
      #vllm-embedding:
      #  condition: service_healthy
      #vllm-generate:
      #  condition: service_healthy
  
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]   # или /api/v1/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - langflow-network
    dns:
      - 10.0.0.181                              # основной корпоративный DNS
      - 10.0.0.34                               # резервный (можно убрать, если он не нужен)
      - 8.8.8.8
    dns_search:
      - company.local                           # опционально, чтобы писать просто "main" вместо "main.company.local"
    extra_hosts: 
    # http://host.docker.internal:11434                             
    - "host.docker.internal:host-gateway"       # ← магическая строка
  
  vllm-generate:
  #FROM RTX 4090(24g)    
    image: vllm/vllm-openai:latest
    container_name: vllm-generate
    #ports:
    #  - "8081:8081"
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - TZ=Europe/Moscow                    # Таймзона
      - NODE_NAME=generate
      - TRANSFORMERS_OFFLINE=1              # Если 0 качает модель из интернета
      - HF_HUB_DISABLE_XET=1
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /opt/.cache/huggingface:/root/.cache/huggingface
    command: 
            - "--model"
            - "Qwen/Qwen3.5-9B"
            #- "Qwen/Qwen2.5-7B-Instruct"
            #- "--cpu-offload-gb"           # На Desktop не использовать
            #- "20"                         # Увеличивает оперативную память выделяемую для модели(предположительно хорошо работает только на серверах) 
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8081"
            - "--dtype"
            - "bfloat16"
            #- "bfloat8"                    
            - "--enforce-eager"             # СПАСИТЕЛЬНЫЙ ФЛАГ: отключает компилятор графов
            - "--gpu-memory-utilization"
            - "0.90"
            - "--max-model-len"
            - "16384"                        # Длина контекста
            - "--max-num-seqs"
            - "128"                         # Количество одномоментных запросов
            - "--enable-auto-tool-choice"
            - "--tool-call-parser" 
            #- "llm_planning"
            - "hermes"                      # Внешний вид ответа от модели, по факту работает только hermes(microsoft) 
    networks:
        - langflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]   # или /health
      interval: 30s                         # проверка каждые 30 секунд
      timeout: 10s                          # таймаут на каждый запрос
      retries: 10                           # 10 неудачных проверок подряд считаются failure
      start_period: 180s                    # 3 минуты на загрузку модели (увеличьте, если нужно) 

  vllm-embedding:
  #FROM RTX 4090(24g)
    image: vllm/vllm-openai:latest
    container_name: vllm-embedding
    depends_on:
      vllm-generate:
        condition: service_healthy
    volumes:
      - /opt/.cache/huggingface:/root/.cache/huggingface
      - /etc/localtime:/etc/localtime:ro
    #ports:
    #  - "8080:8080"
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - TZ=Europe/Moscow 
      - TRANSFORMERS_OFFLINE=1               #Если 0 лезет в интернет качать модели по пути в volumes
    #entrypoint: ["python3", "-m", "vllm.entrypoints.openai.api_server", "--model", "Qwen/Qwen3-Embedding-0.6B", "--host", "0.0.0.0", "--port", "8080"]
    entrypoint: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
    command:
            - "--model"
            - "Qwen/Qwen3-Embedding-0.6B"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            #- "--task"
            #- "embed"
            - "--dtype"
            - "bfloat16"
            - "--max-model-len"
            - "2048"                # сильно уменьшаем (эмбеддингу не нужен длинный контекст)
            - "--gpu-memory-utilization"
            - "0.10"                # резервируем совсем мало (10% от 23.5 ГБ ≈ 2.3 ГБ)
            #- "--enforce-eager"     # экономит память за счёт отключения оптимизаций
            - "--max-num-seqs"
            - "128"                  # уменьшаем параллелизм
    healthcheck:                           
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks:
      - langflow-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    #ports:
    #  - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:                              
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - langflow-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    #ports:
    #  - "6333:6333"                          # API-порт (можно будет обращаться из Langflow по http://qdrant:6333)
    environment:
      - TZ=Europe/Moscow                      # Таймзона
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./qdrant_storage:/qdrant/storage      # постоянное хранилище на хосте
#    healthcheck:
#      test: ["CMD-SHELL", "ps aux | grep -q '[q]drant' || exit 1"]
#      interval: 10s
#      timeout: 5s
#      retries: 5
#      start_period: 30s
    networks:
      - langflow-network                      # используем вашу сеть

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    restart: always
    environment:
      - TZ=Europe/Moscow  # Таймзона  
      - POSTGRES_USER=langflow
      - POSTGRES_PASSWORD=langflow_password
      - POSTGRES_DB=langflow_vectors
    #ports:
    #  - "5433:5432"                          # пробрасываем на хост, чтобы можно было подключаться извне (опционально)
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./pgvector_data:/var/lib/postgresql/data
    networks:
      - langflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langflow -d langflow_vectors"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    restart: always
    #ports:
    #  - "8000:8000"                            # API порт (для доступа с хоста)
    environment:
      - TZ=Europe/Moscow                        # Таймзона
      - IS_PERSISTENT=TRUE                      # сохранять данные на диск
      - PERSIST_DIRECTORY=/chroma/chroma-data
      - ANONYMIZED_TELEMETRY=False              # отключить телеметрию
      - CHROMA_SERVER_AUTH_CREDENTIALS_FILE=
      - CHROMA_SERVER_AUTH_PROVIDER=
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./chroma_data:/chroma/chroma-data        # папка для данных на хосте
#    healthcheck:
#      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat').read()"]
#      interval: 10s
#      timeout: 5s
#      retries: 5
#      start_period: 30s
    networks:
      - langflow-network

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
    environment:
      - TZ=Europe/Moscow                          # Таймзона
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      langflow:
        condition: service_healthy
    networks:
      - langflow-network

  #DEBUG TOOL
  debug-tools:
    image: nicolaka/netshoot:latest
    container_name: debug-tools
    command: sleep infinity 
    environment:
      - TZ=Europe/Moscow                            # Таймзона
    volumes:  
      - /etc/localtime:/etc/localtime:ro
    networks:
      - langflow-network      
    restart: no

networks:
  langflow-network:
    driver: bridge

volumes:
  langflow_db:
  langflow_data:
  ldap_data:
  ldap:
  redis_data:
  langflow_redis_data:
