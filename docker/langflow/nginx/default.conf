server {
    listen 80;

    # Имитация корпоративного SSO через Basic Auth для теста
    location / {
        #auth_basic "Корпоративный ИИ-Ассистент. Введите доменный логин Linux (ivan_ivanov / maria_petrova)";
        #auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://langflow:7860;
        
        # Передача SSO-логина пользователя в заголовок для Langflow Python Component - Kerberos Identity Extractor
        proxy_set_header X-Remote-User $remote_user;
        
        # Стандартные заголовки проксирования веб-сокетов (важно для Langflow чата)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Увеличиваем таймауты для долгих ответов LLM
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}