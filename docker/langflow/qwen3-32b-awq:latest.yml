version: '3.8'

volumes:
  langflow_db:
  langflow_data:

services:
  postgres:
    image: postgres:16
    container_name: langflow-postgres
    restart: always
    environment:
      - POSTGRES_USER=langflow
      - POSTGRES_PASSWORD=langflow_password
      - POSTGRES_DB=langflow
      - TZ=Europe/Moscow 
    volumes:
      - langflow_db:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - langflow-network

  langflow:
    image: langflowai/langflow:latest
    container_name: langflow
    restart: always
    ports:
      - "7860:7860"                    # внешний порт → внутренний
    environment:
      # Подключение к PostgreSQL
      - LANGFLOW_DATABASE_URL=postgresql://langflow:langflow_password@postgres:5432/langflow
      # Настройки суперпользователя (логин по умолчанию: langflow)
      # - LANGFLOW_SUPERUSER
      - LANGFLOW_SUPERUSER_PASSWORD=admin_password   # 🔒 смени на свой
      - LANGFLOW_AUTO_LOGIN=false      # не входить автоматически
      #Белый список защиты от SSR атак
      - LANGFLOW_SSRF_ALLOWED_HOSTS=host.docker.internal
      #A2A
      - LANGFLOW_A2A_ENABLED=true
      - LANGFLOW_CORS_ALLOW_ORIGINS=*   # разрешить все источники (небезопасно для продакшена)
      # или конкретно ваш домен:
      # - LANGFLOW_CORS_ALLOW_ORIGINS=http://192.168.0.169:7860,https://ваш-домен.ru
      
      # Таймзона
      - TZ=Europe/Moscow
    volumes:
      - langflow_data:/app/.langflow   # для хранения файлов flows (если нужны)
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - langflow-network
    extra_hosts: 
    # http://host.docker.internal:11434                             
    - "host.docker.internal:host-gateway"       # ← магическая строка

