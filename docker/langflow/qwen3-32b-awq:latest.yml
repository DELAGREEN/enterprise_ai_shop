  vllm-generate:
  #FROM RTX 4090    
    image: vllm/vllm-openai:v0.8.3
    ports:
      - "8081:8081"
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - TZ=Europe/Moscow  # Таймзона
      - NODE_NAME=generate
      - TRANSFORMERS_OFFLINE=0
      - HF_HUB_DISABLE_XET=1
      #- VLLM_SWAP_SPACE=20
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /opt/.cache/huggingface:/root/.cache/huggingface
    command: 
            - "--model"
            - "Qwen/Qwen3-32B-AWQ"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8081"
            - "--quantization"
            - "awq_marlin" #Супер быстрые ядра marlin специально для CUDA 
            - "--gpu-memory-utilization"
            - "0.90" # Чуть снизим, чтобы CUDA Graphs влезли в память
            #- "--tensor-parallel-size"  #Указать движку на сколько видеокарт можно разделить модель, если она не влазит в одну
            #- "2" #3, 4, 8
            - "--max-model-len"
            - "4096" # контекст
            - "--max-num-seqs"
            - "32" # Даем vLLM собирать большие батчи
            - "--enable-chunked-prefill"
            - "true"              # Обязательно! Режет длинные промпты на куски, спасая GPU от рывков
            - "--kv-cache-dtype"
            - "fp8"            
            - "--enable-auto-tool-choice"
            - "--tool-call-parser"
            - "hermes"
    networks:
        - langflow-network

networks:
  langflow-network:
    driver: bridge
    